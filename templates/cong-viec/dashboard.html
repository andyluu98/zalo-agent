<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Công việc từ Zalo</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --ink: #18202b; --soft: #5b6676; --line: #e3e7ed;
    --accent: #2457d6; --red: #c8352b; --red-bg: #fdeceb; --amber: #b86e00; --amber-bg: #fff4e0;
    --green: #1f8a4c; --green-bg: #e7f6ed; --blue-bg: #e8effd; --gray-bg: #eef0f3; --shadow: 0 1px 2px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1318; --panel: #171c23; --ink: #e8ecf1; --soft: #95a1b2; --line: #263040;
      --accent: #6d9bff; --red: #ff7a6e; --red-bg: #3a1d1b; --amber: #f2b250; --amber-bg: #372a12;
      --green: #5fd08f; --green-bg: #15301f; --blue-bg: #18243d; --gray-bg: #212833; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; margin-bottom: 16px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
  .meta { color: var(--soft); font-size: 13px; }
  .alert { background: var(--red-bg); color: var(--red); border: 1px solid currentColor; border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; font-weight: 600; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); cursor: pointer; text-align: left; color: inherit; font: inherit; }
  .kpi:hover { border-color: var(--accent); }
  .kpi b { display: block; font-size: 26px; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .kpi span { color: var(--soft); font-size: 13px; }
  .kpi.red b { color: var(--red); } .kpi.amber b { color: var(--amber); } .kpi.green b { color: var(--green); }
  .grid { display: grid; grid-template-columns: 1fr 300px; gap: 16px; align-items: start; }
  .grid.wide { grid-template-columns: 1fr; }
  .grid.wide aside { display: none; }
  @media (max-width: 880px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; border-bottom: 1px solid var(--line); align-items: center; }
  .views { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .view { border: 0; background: transparent; color: var(--soft); padding: 6px 12px; cursor: pointer; font: inherit; font-size: 13px; }
  .view + .view { border-left: 1px solid var(--line); }
  .view.on { background: var(--ink); color: var(--panel); }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; width: 100%; }
  .tab { border: 1px solid var(--line); background: transparent; color: var(--soft); border-radius: 999px; padding: 5px 12px; cursor: pointer; font: inherit; font-size: 13px; }
  .tab.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tab small { opacity: .8; margin-left: 4px; }
  input, select { font: inherit; font-size: 13px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  input { flex: 1; min-width: 160px; }
  .list { list-style: none; margin: 0; padding: 0; }
  .item { border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .row { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; cursor: pointer; width: 100%; background: none; border: 0; color: inherit; font: inherit; text-align: left; }
  .row:hover { background: var(--gray-bg); }
  .score { font-weight: 700; font-size: 15px; text-align: center; border-radius: 8px; padding: 4px 0; font-variant-numeric: tabular-nums; }
  .p-cao { background: var(--red-bg); color: var(--red); } .p-trung { background: var(--amber-bg); color: var(--amber); } .p-thap { background: var(--gray-bg); color: var(--soft); }
  .title { font-weight: 600; }
  .sub { color: var(--soft); font-size: 12.5px; margin-top: 2px; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .badge { font-size: 12px; border-radius: 999px; padding: 2px 9px; white-space: nowrap; background: var(--gray-bg); color: var(--soft); }
  .b-qua { background: var(--red-bg); color: var(--red); font-weight: 600; }
  .b-nay { background: var(--amber-bg); color: var(--amber); font-weight: 600; }
  .b-xong { background: var(--green-bg); color: var(--green); }
  .detail { display: none; padding: 0 14px 14px 82px; color: var(--ink); }
  .item.open .detail { display: block; }
  .detail p { margin: 0 0 8px; }
  .detail h4 { margin: 10px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--soft); }
  .src { font-size: 13px; padding: 6px 10px; border-left: 3px solid var(--accent); background: var(--gray-bg); border-radius: 0 6px 6px 0; margin-bottom: 6px; }
  .src a { color: var(--accent); text-decoration: none; }
  .tl { font-size: 12.5px; color: var(--soft); margin: 2px 0; }
  .empty { padding: 32px; text-align: center; color: var(--soft); }
  /* Kanban + ma trận */
  .board { display: grid; gap: 12px; padding: 12px; }
  .board.kanban { grid-template-columns: repeat(4, minmax(220px, 1fr)); overflow-x: auto; }
  .board.matrix { grid-template-columns: 1fr 1fr; }
  @media (max-width: 760px) { .board.matrix { grid-template-columns: 1fr; } }
  .col { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; min-height: 120px; }
  .col h3 { margin: 0 0 2px; font-size: 14px; display: flex; justify-content: space-between; align-items: baseline; }
  .col h3 small { color: var(--soft); font-weight: 400; }
  .col .hint { font-size: 12px; color: var(--soft); margin-bottom: 8px; }
  .q1 { border-top: 4px solid var(--red); } .q2 { border-top: 4px solid var(--accent); }
  .q3 { border-top: 4px solid var(--amber); } .q4 { border-top: 4px solid var(--soft); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 9px 10px; margin-bottom: 8px; cursor: pointer; box-shadow: var(--shadow); width: 100%; text-align: left; color: inherit; font: inherit; display: block; }
  .card:hover { border-color: var(--accent); }
  .card.qua { border-left: 4px solid var(--red); } .card.nay { border-left: 4px solid var(--amber); }
  .card .title { font-size: 13.5px; }
  .card .sub { font-size: 12px; }
  .card .badges { justify-content: flex-start; margin-top: 6px; }
  .card .why { font-size: 12px; color: var(--soft); margin-top: 4px; font-style: italic; }
  .axis { font-size: 11.5px; color: var(--soft); }
  .note { font-size: 12px; color: var(--soft); padding: 0 12px 12px; }
  dialog { border: 1px solid var(--line); border-radius: 12px; padding: 0; width: min(680px, 94vw); background: var(--panel); color: var(--ink); }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog .dh { display: flex; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  dialog .db { padding: 12px 16px 16px; }
  dialog .db .detail { display: block; padding: 0; }
  .x { border: 0; background: none; font-size: 20px; cursor: pointer; color: var(--soft); }
  aside .panel { padding: 14px; margin-bottom: 16px; }
  aside h3 { margin: 0 0 10px; font-size: 14px; }
  .legend { display: flex; gap: 12px; font-size: 12px; color: var(--soft); margin-top: 6px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
  .who { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; border-bottom: 1px dashed var(--line); }
  .who:last-child { border-bottom: 0; }
  .nodata { background: var(--amber-bg); color: var(--amber); padding: 16px; border-radius: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Công việc từ Zalo</h1>
    <div class="meta" id="meta"></div>
  </header>
  <div id="alerts"></div>
  <div class="kpis" id="kpis"></div>
  <div class="grid" id="grid">
    <section class="panel">
      <div class="toolbar">
        <div class="views" role="tablist" aria-label="Kiểu xem">
          <button class="view" data-view="list">Danh sách</button>
          <button class="view" data-view="kanban">Kanban</button>
          <button class="view" data-view="matrix">Ma trận Eisenhower</button>
        </div>
        <input id="q" type="search" placeholder="Tìm việc, người, nhóm..." />
        <select id="nguoi"><option value="">Mọi người giao</option></select>
        <div class="tabs" id="tabs"></div>
      </div>
      <ul class="list" id="list"></ul>
      <div id="board"></div>
    </section>
    <aside>
      <div class="panel"><h3>14 ngày gần đây</h3><div id="chart"></div>
        <div class="legend"><span><i class="dot" style="background:var(--accent)"></i>Việc mới</span><span><i class="dot" style="background:var(--green)"></i>Xong</span></div>
      </div>
      <div class="panel"><h3>Ai giao nhiều việc đang mở</h3><div id="who"></div></div>
    </aside>
  </div>
</div>
<dialog id="dlg"><div class="dh"><div id="dlgTitle" class="title"></div><button class="x" data-close aria-label="Đóng">×</button></div><div class="db" id="dlgBody"></div></dialog>
<script src="du-lieu-dashboard.js"></script>
<script>
(function () {
  const D = window.CONG_VIEC;
  const $ = (id) => document.getElementById(id);
  if (!D || !Array.isArray(D.viec)) {
    $("list").innerHTML = '<li class="nodata">Không thấy <b>du-lieu-dashboard.js</b> cạnh file này. Nếu đây là bản mẫu trong repo (<code>templates/cong-viec/</code>) thì mở bản trong thư mục log: <b>&lt;CHAT_EXPORT_DIR&gt;/cong-viec/dashboard.html</b>. Nếu đúng thư mục log rồi thì chạy lượt tổng hợp lần đầu để tạo dữ liệu.</li>';
    return;
  }
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const MO = new Set(["moi", "dang_lam", "cho_phan_hoi"]);
  const TEN_TT = { moi: "Mới", dang_lam: "Đang làm", cho_phan_hoi: "Chờ phản hồi", xong: "Xong", huy: "Hủy" };
  const now = new Date();
  const homNay = now.toLocaleDateString("sv-SE");
  const acc = Object.keys(D.docLogDen || D.trangThaiBot || {})[0] || "";
  const ngayCua = (s) => (s ? String(s).slice(0, 10) : "");
  // Hạn chỉ có ngày ("2026-10-08") tính tới hết ngày đó theo giờ máy, không phải 00:00 UTC
  const mocHan = (h) => (String(h).length <= 10 ? new Date(h + "T23:59:59") : new Date(h));
  const quaHan = (v) => MO.has(v.trangThai) && v.han && mocHan(v.han) < now;
  const hanNay = (v) => MO.has(v.trangThai) && ngayCua(v.han) === homNay && !quaHan(v);
  const tonDong = (v) => MO.has(v.trangThai) && v.ngayPhatHien < homNay;
  const laToi = (s) => /^tôi(\s|$|\()/i.test(String(s || "").trim());
  // Việc tôi giao cho NGƯỜI KHÁC - không tính việc tự nhắc mình
  const toiGiao = (v) => MO.has(v.trangThai) && laToi(v.nguoiGiao) && !laToi(v.giaoCho);
  const gioHan = (v) => {
    if (!v.han) return "";
    const d = new Date(v.han);
    const ngay = ngayCua(v.han) === homNay ? "hôm nay" : d.toLocaleDateString("vi-VN");
    return (String(v.han).length > 10 ? d.toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" }) + " " : "") + ngay;
  };

  // Hai trục Eisenhower. Sổ cũ (chưa có diemGap / diemQuanTrong) thì ước tính tạm từ hạn + lý do;
  // lượt tổng hợp kế tiếp theo HUONG-DAN v2 sẽ chấm chính xác.
  const ngayToi = (h) => Math.floor((mocHan(h) - new Date(homNay + "T00:00:00")) / 864e5);
  for (const v of D.viec) {
    v._uocTinh = v.diemGap == null || v.diemQuanTrong == null;
    if (v.diemGap == null) {
      let g = 0;
      if (v.han) { const n = ngayToi(v.han); g += quaHan(v) ? 70 : n <= 0 ? 60 : n === 1 ? 50 : n <= 3 ? 25 : 0; }
      if ((v.lyDoUuTien || []).some((l) => /gấp/i.test(l))) g += 25;
      g += Math.min(30, 15 * Math.max(0, (v.lanNhac || 1) - 1));
      v.diemGap = Math.min(100, g);
    }
    if (v.diemQuanTrong == null) {
      const ly = (v.lyDoUuTien || []).join(" ");
      let q = 0;
      if (/quan trọng|sếp/i.test(ly)) q += 50;
      if (/khách|tiền|hợp đồng|báo giá|thanh toán|đối tác/i.test(ly)) q += 50;
      v.diemQuanTrong = Math.min(100, q);
    }
    if (!v.oEisenhower) v.oEisenhower = v.diemGap >= 50 ? (v.diemQuanTrong >= 50 ? 1 : 3) : v.diemQuanTrong >= 50 ? 2 : 4;
  }

  // Header + cảnh báo bot
  $("meta").textContent = "Cập nhật " + (D.capNhatLuc ? new Date(D.capNhatLuc).toLocaleString("vi-VN") : "?") + " · " + D.viec.length + " việc trong sổ";
  const canhBao = Object.entries(D.trangThaiBot || {}).filter(([, t]) => t && t.canhBao);
  $("alerts").innerHTML = canhBao.map(([a, t]) => `<div class="alert">⚠ ${esc(a)}: ${esc(t.canhBao)}</div>`).join("");

  const tabs = [
    ["mo", "Đang mở", (v) => MO.has(v.trangThai)],
    ["cao", "Quan trọng", (v) => MO.has(v.trangThai) && v.uuTien === "cao"],
    ["qua", "Quá hạn", quaHan],
    ["nay", "Hạn hôm nay", hanNay],
    ["ton", "Tồn đọng", tonDong],
    ["toi", "Tôi giao đi", toiGiao],
    ["xong", "Đã xong", (v) => v.trangThai === "xong"],
    ["all", "Tất cả", () => true],
  ];
  const xong7 = (v) => v.trangThai === "xong" && v.xongLuc && now - new Date(v.xongLuc) < 7 * 864e5;
  const kpis = [
    ["qua", "Quá hạn", D.viec.filter(quaHan).length, "red"],
    ["nay", "Hạn hôm nay", D.viec.filter(hanNay).length, "amber"],
    ["ton", "Tồn đọng", D.viec.filter(tonDong).length, ""],
    ["mo", "Đang mở", D.viec.filter((v) => MO.has(v.trangThai)).length, ""],
    ["xong", "Xong 7 ngày", D.viec.filter(xong7).length, "green"],
  ];
  let tab = "mo";
  let view = "list";
  try { view = localStorage.getItem("cv-view") || "list"; } catch { /* không có storage */ }
  $("kpis").innerHTML = kpis.map(([k, t, n, c]) => `<button class="kpi ${c}" data-tab="${k}"><b>${n}</b><span>${t}</span></button>`).join("");

  const nguoiSet = [...new Set(D.viec.map((v) => v.nguoiGiao).filter(Boolean))].sort((a, b) => a.localeCompare(b, "vi"));
  $("nguoi").innerHTML += nguoiSet.map((n) => `<option>${esc(n)}</option>`).join("");

  const sapXep = (a, b) => (b.diem || 0) - (a.diem || 0) || String(a.han || "9").localeCompare(String(b.han || "9"));
  const locChung = (v) => {
    const q = $("q").value.trim().toLowerCase();
    const ng = $("nguoi").value;
    return (!ng || v.nguoiGiao === ng) && (!q || [v.tieuDe, v.chiTiet, v.nguoiGiao, v.giaoCho, v.cuocTroChuyen].join(" ").toLowerCase().includes(q));
  };
  const badgesCua = (v) => {
    const b = [];
    if (quaHan(v)) b.push('<span class="badge b-qua">Quá hạn ' + esc(gioHan(v)) + "</span>");
    else if (hanNay(v)) b.push('<span class="badge b-nay">Hạn ' + esc(gioHan(v)) + "</span>");
    else if (v.han && MO.has(v.trangThai)) b.push('<span class="badge">Hạn ' + esc(gioHan(v)) + "</span>");
    b.push(`<span class="badge ${v.trangThai === "xong" ? "b-xong" : ""}">${TEN_TT[v.trangThai] || esc(v.trangThai)}</span>`);
    if ((v.lanNhac || 1) > 1) b.push(`<span class="badge">Nhắc ${v.lanNhac} lần</span>`);
    return b.join("");
  };
  const chiTietCua = (v) => {
    const nguon = (v.nguon || []).map((n) => `<div class="src"><a href="../${esc(acc)}/${esc(n.file)}">${esc(n.file)}</a> · ${esc(n.gio)}<br>“${esc(n.trich)}”</div>`).join("");
    const cn = (v.capNhat || []).map((c) => `<div class="tl">${esc(String(c.luc).replace("T", " ").slice(0, 16))} · ${esc(c.noiDung)}</div>`).join("");
    return `<div class="detail">
      ${v.chiTiet ? `<p>${esc(v.chiTiet)}</p>` : ""}
      ${v.hanGoc ? `<p><b>Hạn gốc:</b> ${esc(v.hanGoc)}</p>` : ""}
      <p><b>Gấp</b> ${v.diemGap} · <b>Quan trọng</b> ${v.diemQuanTrong} · ô ${v.oEisenhower}${v._uocTinh ? " (ước tính)" : ""}${v.lyDoO ? ": " + esc(v.lyDoO) : ""}</p>
      ${(v.lyDoUuTien || []).length ? `<p><b>Dấu hiệu:</b> ${v.lyDoUuTien.map(esc).join(", ")}</p>` : ""}
      ${v.ghiChu ? `<p><b>Ghi chú:</b> ${esc(v.ghiChu)}</p>` : ""}
      <h4>Tin gốc</h4>${nguon || '<div class="tl">Không có</div>'}
      ${cn ? `<h4>Lịch sử</h4>${cn}` : ""}
    </div>`;
  };
  const theCua = (v) => `<button class="card ${quaHan(v) ? "qua" : hanNay(v) ? "nay" : ""}" data-id="${v.id}">
      <div class="title">#${v.id} ${esc(v.tieuDe)}</div>
      <div class="sub">${esc(v.nguoiGiao)} → ${esc(v.giaoCho)} · ${esc(v.cuocTroChuyen)}</div>
      <div class="badges">${badgesCua(v)}</div>
      ${view === "matrix" && v.lyDoO ? `<div class="why">${esc(v.lyDoO)}</div>` : ""}
    </button>`;

  function veDanhSach() {
    const loc = tabs.find((t) => t[0] === tab)[2];
    $("tabs").innerHTML = tabs.map(([k, t, f]) => `<button class="tab ${k === tab ? "on" : ""}" data-tab="${k}">${t}<small>${D.viec.filter(f).length}</small></button>`).join("");
    const ds = D.viec.filter(loc).filter(locChung).sort(sapXep);
    $("list").innerHTML = ds.length
      ? ds.map((v) => `<li class="item"><button class="row">
          <div class="score p-${esc(v.uuTien || "thap")}">${v.diem ?? "-"}</div>
          <div><div class="title">#${v.id} ${esc(v.tieuDe)}</div>
            <div class="sub">${esc(v.nguoiGiao)} → ${esc(v.giaoCho)} · ${esc(v.cuocTroChuyen)} · phát hiện ${esc(v.ngayPhatHien)}</div></div>
          <div class="badges">${badgesCua(v)}</div>
        </button>${chiTietCua(v)}</li>`).join("")
      : '<li class="empty">Không có việc nào ở mục này.</li>';
  }

  function veKanban() {
    const cot = [
      ["moi", "Mới", "Chưa bắt đầu"],
      ["dang_lam", "Đang làm", "Đã nhận, đang xử lý"],
      ["cho_phan_hoi", "Chờ phản hồi", "Đợi người khác / lâu không ai nhắc"],
      ["xong", "Xong", "7 ngày gần đây"],
    ];
    const ds = D.viec.filter(locChung);
    $("board").className = "board kanban";
    $("board").innerHTML = cot.map(([tt, ten, goiY]) => {
      const the = ds.filter((v) => (tt === "xong" ? xong7(v) : v.trangThai === tt)).sort(sapXep);
      return `<div class="col"><h3>${ten}<small>${the.length}</small></h3><div class="hint">${goiY}</div>${the.map(theCua).join("") || '<div class="tl">Trống</div>'}</div>`;
    }).join("");
  }

  function veMaTran() {
    const o = [
      [1, "q1", "1 · Làm ngay", "Gấp + quan trọng"],
      [2, "q2", "2 · Lên lịch", "Quan trọng, chưa gấp"],
      [3, "q3", "3 · Giao / làm nhanh", "Gấp, không quan trọng"],
      [4, "q4", "4 · Để sau / bỏ", "Không gấp, không quan trọng"],
    ];
    const ds = D.viec.filter((v) => MO.has(v.trangThai)).filter(locChung);
    $("board").className = "board matrix";
    const coUocTinh = ds.some((v) => v._uocTinh);
    $("board").innerHTML = o.map(([so, cls, ten, goiY]) => {
      const the = ds.filter((v) => Number(v.oEisenhower) === so).sort(sapXep);
      return `<div class="col ${cls}"><h3>${ten}<small>${the.length}</small></h3><div class="hint">${goiY}</div>${the.map(theCua).join("") || '<div class="tl">Trống</div>'}</div>`;
    }).join("") + (coUocTinh ? '<div class="note" style="grid-column:1/-1">Một số việc chưa có điểm hai trục, đang xếp ô theo ước tính. Lượt tổng hợp kế tiếp sẽ chấm chính xác.</div>' : "");
  }

  function ve() {
    document.querySelectorAll(".view").forEach((b) => b.classList.toggle("on", b.dataset.view === view));
    $("grid").classList.toggle("wide", view !== "list");
    $("list").style.display = view === "list" ? "" : "none";
    $("tabs").style.display = view === "list" ? "" : "none";
    $("board").style.display = view === "list" ? "none" : "";
    if (view === "list") veDanhSach();
    else if (view === "kanban") veKanban();
    else veMaTran();
  }

  // Biểu đồ 14 ngày: việc mới vs xong
  (function chart() {
    const ngay = [];
    for (let i = 13; i >= 0; i--) ngay.push(new Date(now - i * 864e5).toLocaleDateString("sv-SE"));
    const ls = D.lichSuNgay || {};
    const max = Math.max(1, ...ngay.map((d) => Math.max(ls[d]?.moi || 0, ls[d]?.xong || 0)));
    const W = 272, H = 110, bw = W / 14;
    const bars = ngay.map((d, i) => {
      const m = ((ls[d]?.moi || 0) / max) * (H - 18), x = ((ls[d]?.xong || 0) / max) * (H - 18);
      return `<rect x="${i * bw + 2}" y="${H - 14 - m}" width="${bw / 2 - 2}" height="${m}" rx="2" fill="var(--accent)"><title>${d}: ${ls[d]?.moi || 0} mới</title></rect>
        <rect x="${i * bw + bw / 2}" y="${H - 14 - x}" width="${bw / 2 - 2}" height="${x}" rx="2" fill="var(--green)"><title>${d}: ${ls[d]?.xong || 0} xong</title></rect>`;
    }).join("");
    const nhan = [0, 6, 13].map((i) => `<text x="${i * bw + 2}" y="${H}" font-size="10" fill="var(--soft)">${ngay[i].slice(8)}/${ngay[i].slice(5, 7)}</text>`).join("");
    $("chart").innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Việc mới và xong 14 ngày">${bars}${nhan}</svg>`;
  })();

  // Ai giao nhiều việc đang mở
  const dem = {};
  D.viec.filter((v) => MO.has(v.trangThai)).forEach((v) => { dem[v.nguoiGiao || "?"] = (dem[v.nguoiGiao || "?"] || 0) + 1; });
  const top = Object.entries(dem).sort((a, b) => b[1] - a[1]).slice(0, 8);
  $("who").innerHTML = top.length ? top.map(([n, c]) => `<div class="who"><span>${esc(n)}</span><b>${c}</b></div>`).join("") : '<div class="tl">Không có việc mở</div>';

  document.addEventListener("click", (e) => {
    const vw = e.target.closest("[data-view]");
    if (vw) { view = vw.dataset.view; try { localStorage.setItem("cv-view", view); } catch { /* bỏ qua */ } ve(); return; }
    const t = e.target.closest("[data-tab]");
    if (t) { tab = t.dataset.tab; view = "list"; ve(); return; }
    const c = e.target.closest(".card");
    if (c) {
      const v = D.viec.find((x) => String(x.id) === c.dataset.id);
      $("dlgTitle").textContent = `#${v.id} ${v.tieuDe}`;
      $("dlgBody").innerHTML = `<div class="sub" style="margin-bottom:8px">${esc(v.nguoiGiao)} → ${esc(v.giaoCho)} · ${esc(v.cuocTroChuyen)}</div><div class="badges" style="justify-content:flex-start;margin-bottom:10px">${badgesCua(v)}</div>${chiTietCua(v)}`;
      $("dlg").showModal();
      return;
    }
    if (e.target.closest("[data-close]") || e.target === $("dlg")) { $("dlg").close(); return; }
    const r = e.target.closest(".row");
    if (r) r.parentElement.classList.toggle("open");
  });
  $("q").addEventListener("input", ve);
  $("nguoi").addEventListener("change", ve);
  ve();
})();
</script>
</body>
</html>
